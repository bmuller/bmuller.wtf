<div class="investments-container">
  {{- range (where .Page.Params.investments "type" .Params.type) }}
  <div class="investment {{ if .defunct }}defunct-investment{{ end }}">
    <div class="investment-logo">
      <img src="/logos/{{ .logo }}" alt="{{ .name }} logo" loading="lazy" />
    </div>
    <h3><a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a></h3>
    {{- with .desc }}
    <div class="investment-desc">{{ . }}</div>
    {{- end }}
    <div class="investment-badges">
      {{- with .exit }}<a class="investment-badge exit" href="{{ . }}" target="_blank" rel="noopener">🚀 Exit</a>{{ end -}}
      {{- if .defunct }}<span class="investment-badge defunct">Wound Down</span>{{ end -}}
    </div>
  </div>
  {{- end }}
</div>
